<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Waste Cash-Out | Earn from Tech Junk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <nav class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-green-400">♻️ E-Waste Cash-Out</h1>
        <button class="bg-green-500 px-4 py-2 rounded-lg font-bold text-black">Login</button>
    </nav>

    <main class="flex flex-col items-center justify-center py-20 px-4 text-center">
        <h2 class="text-5xl font-extrabold mb-6">India's First <span class="text-green-400">E-Waste</span> Marketplace</h2>
        <p class="text-gray-400 max-w-lg mb-10 text-lg">Ghar baithe purani battery aur electronics bechein. AI se instant price payein.</p>
        
        <div class="bg-gray-800 p-10 rounded-3xl shadow-2xl border border-gray-700 w-full max-w-md">
            <div class="border-2 border-dashed border-gray-600 p-8 rounded-2xl mb-6">
                <p class="text-gray-400 mb-4 text-sm">Upload Photo of Item</p>
                <input type="file" id="upload" class="hidden">
                <label for="upload" class="cursor-pointer bg-white text-black px-6 py-3 rounded-full font-bold hover:bg-green-400 transition">📷 Select Photo</label>
            </div>
            <button onclick="alert('AI Analysing... Price: ₹450 estimated')" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-xl hover:bg-blue-700">Get AI Quote</button>
        </div>
    </main>

    <section class="bg-gray-800 py-10 text-center border-t border-gray-700">
        <p class="text-sm text-gray-500">Currently serving: Delhi, Mumbai, Bangalore, Pune</p>
    </section>
</body>
</html>
